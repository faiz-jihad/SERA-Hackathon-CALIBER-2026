version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: sera_db
    environment:
      POSTGRES_USER: sera_user
      POSTGRES_PASSWORD: sera_pass
      POSTGRES_DB: sera_db
    ports:
      - "5432:5432"
    volumes:
      - sera_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sera_user -d sera_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sera_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sera_user:sera_pass@db:5432/sera_db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sera_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sera_postgres_data:
